# Configuration for tasks in the vacation planner project.
research_task:
  description: >
    Analyse the user request: "{topic}".
    Research it using the research tool you have been given. If that tool needs a city, pass only the bare city name (for example "Mumbai"), not the whole request.
  expected_output: >
    A list of 15 bullet points highlighting the most important and exciting facts about {topic}.
    If travel packages were fetched, list the available packages with details for the {topic}.
    If web search was performed, list key facts, attractions, and travel tips.
  agent: vacation_researcher

reporting_task:
  description: >
    Review the research findings and create a detailed report about {topic}.
  expected_output: >
    A fully fledged report summarizing key information about {topic},
    formatted in Markdown without using code block syntax (do not use triple backticks).
  agent: itinerary_planner
  output_file: report.md
  output_format: markdown
