[project]
name = "vacation_planner"
version = "0.1.0"
description = "Vacation planner crew"
readme = "README.md"
authors = [
    { name = "goumze", email = "gm_mishra@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai[tools,bedrock]>=1.15.28",
    "python-dotenv>=1.2.4",
]

[project.scripts]
run_crew = "vacation_planner.main:run"
train = "vacation_planner.main:train"
replay = "vacation_planner.main:replay"
test = "vacation_planner.main:test"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.crewai]
type = "crew"
