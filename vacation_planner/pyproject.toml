[project]
name = "vacation_planner"
version = "0.1.0"
description = "Vacation planner crew"
readme = "README.md"
authors = [
    { name = "goumze", email = "gm_mishra@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv==1.4.7",
    "bedrock-agentcore>=1.21.0",
    "boto3>=1.43.46",
    "chromadb>=1.5.9",
    "crewai[bedrock,tools]>=1.15.28",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "ipython>=9.17.1",
    "jq>=1.13.0",
    "langchain>=1.4.6",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-litellm>=0.11.1",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "litellm>=1.106.0",
    "matplotlib>=3.11.2",
    "msoffcrypto-tool>=6.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pymupdf>=1.26.7",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "tiktoken>=0.12.0",
    "unstructured>=0.27.30",
    "wikipedia>=1.4.0",
]

[project.scripts]
run_crew = "vacation_planner.main:run"
train = "vacation_planner.main:train"
replay = "vacation_planner.main:replay"
test = "vacation_planner.main:test"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.crewai]
type = "crew"
project_id = "e0048574-2d2b-4427-8cc7-e5336f16dda1"
