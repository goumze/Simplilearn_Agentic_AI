    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "litellm>=1.105.1",
    "matplotlib>=3.11.2",
    "msoffcrypto-tool>=6.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "pypdf>=6.21.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.28",
    "wikipedia>=1.4.0",
