apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.gitOpsRepo.url }}
    path: gitops/charts/agentgateway
    targetRevision: {{ .Values.gitOpsRepo.branch }}
    helm:
      releaseName: agent-gateway
      values: |
        namespace: agentgateway-system
        replicaCount: 2
        image:
          repository: ghcr.io/kgateway-dev/agent-gateway
          tag: v2.2.0-main
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 8080
          metricsPort: 9090
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
        serviceAccount:
          create: true
          name: agent-gateway
        observability:
          enabled: true
          opentelemetry:
            enabled: true
            endpoint: http://jaeger.agentgateway-system.svc.cluster.local:4317
            protocol: grpc
          prometheus:
            enabled: true
            port: 9090
            path: /metrics
        security:
          jwt:
            enabled: true
          mcp:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespaces.agentGateway | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true