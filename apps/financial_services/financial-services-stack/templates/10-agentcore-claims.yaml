{{- range .Values.agents }}
{{- if .agentcore.memory }}
---
apiVersion: kro.run/v1alpha1
kind: AgentCoreMemory
metadata:
  name: {{ .name }}-memory
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: financial-services
    agent: {{ .name }}
spec:
  region: {{ $.Values.awsRegion }}
  name: {{ .name | replace "-" "_" }}_memory
  description: {{ printf "%s AgentCore memory" .name | quote }}
  writeConnectionSecretName: {{ .name }}-memory-id
  tags:
    app: financial-services
    agent: {{ .name }}
{{- end }}
{{- if .agentcore.browser }}
---
apiVersion: kro.run/v1alpha1
kind: AgentCoreBrowser
metadata:
  name: {{ .name }}-browser
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: financial-services
    agent: {{ .name }}
spec:
  region: {{ $.Values.awsRegion }}
  name: {{ .name | replace "-" "_" }}_browser
  description: {{ printf "%s AgentCore browser" .name | quote }}
  writeConnectionSecretName: {{ .name }}-browser-id
  tags:
    app: financial-services
    agent: {{ .name }}
{{- end }}
{{- if .agentcore.codeInterpreter }}
---
apiVersion: kro.run/v1alpha1
kind: AgentCoreCodeInterpreter
metadata:
  name: {{ .name }}-code-interpreter
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: financial-services
    agent: {{ .name }}
spec:
  region: {{ $.Values.awsRegion }}
  name: {{ .name | replace "-" "_" }}_code_interpreter
  description: {{ printf "%s AgentCore code interpreter" .name | quote }}
  writeConnectionSecretName: {{ .name }}-code-interpreter-id
  tags:
    app: financial-services
    agent: {{ .name }}
{{- end }}
{{- end }}
