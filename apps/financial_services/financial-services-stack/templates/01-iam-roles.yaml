{{- range .Values.agents }}
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: fs-{{ .name }}-role
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  name: fs-{{ $.Values.eksClusterName }}-{{ .name }}-role
  # EKS Pod Identity trust (not OIDC/IRSA).
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "Service": "pods.eks.amazonaws.com" },
          "Action": ["sts:AssumeRole", "sts:TagSession"]
        }
      ]
    }
  inlinePolicies:
    bedrock-invoke: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "bedrock:InvokeModel",
              "bedrock:InvokeModelWithResponseStream"
            ],
            "Resource": "*"
          }
        ]
      }
  tags:
    - key: app
      value: financial-services
    - key: agent
      value: {{ .name }}
{{- end }}
