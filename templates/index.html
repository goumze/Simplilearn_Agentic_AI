<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidekick — Personal Co-worker</title>
  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --emerald:      #10b981;
      --emerald-dark: #059669;
      --emerald-light:#d1fae5;
      --danger:       #ef4444;
      --danger-dark:  #dc2626;
      --bg:           #f9fafb;
      --surface:      #ffffff;
      --border:       #e5e7eb;
      --text:         #111827;
      --muted:        #6b7280;
      --user-bg:      #10b981;
      --user-text:    #ffffff;
      --bot-bg:       #f3f4f6;
      --bot-text:     #111827;
      --eval-bg:      #fefce8;
      --eval-border:  #fde047;
      --radius:       12px;
      --shadow:       0 1px 3px rgba(0,0,0,.1);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Layout ───────────────────────────────────────────────────────── */
    .app {
      width: 100%;
      max-width: 820px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 12px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 0 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header .logo {
      width: 36px; height: 36px;
      background: var(--emerald);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    header .subtitle { font-size: .8rem; color: var(--muted); margin-top: 1px; }

    /* ── Chat window ──────────────────────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .empty-state p { font-size: .9rem; }

    /* ── Message bubbles ─────────────────────────────────────────────── */
    .msg { display: flex; gap: 8px; max-width: 92%; }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }
    .msg.evaluator { align-self: flex-start; max-width: 98%; width: 98%; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
    .msg.user .avatar      { background: var(--emerald); color: #fff; }
    .msg.assistant .avatar { background: #e5e7eb; color: var(--text); }
    .msg.evaluator .avatar { background: #fde047; color: #78350f; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: .9rem;
      line-height: 1.55;
      box-shadow: var(--shadow);
    }
    .msg.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 3px;
    }
    .msg.assistant .bubble {
      background: var(--bot-bg);
      color: var(--bot-text);
      border-bottom-left-radius: 3px;
    }
    .msg.evaluator .bubble {
      background: var(--eval-bg);
      color: #78350f;
      border: 1px solid var(--eval-border);
      border-bottom-left-radius: 3px;
      font-size: .82rem;
      width: 100%;
    }
    .bubble p { margin-bottom: .4em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { font-weight: 600; }
    .bubble code {
      background: rgba(0,0,0,.07);
      padding: 1px 4px;
      border-radius: 4px;
      font-size: .85em;
    }
    .label {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .msg.evaluator .label { color: #92400e; }

    /* ── Typing indicator ────────────────────────────────────────────── */
    .typing .bubble {
      display: flex; gap: 5px; align-items: center;
      padding: 12px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce .9s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }

    /* ── Input panel ─────────────────────────────────────────────────── */
    .input-panel {
      padding: 14px 0 18px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-panel textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: .9rem;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color .15s;
      background: var(--surface);
    }
    .input-panel textarea:focus { border-color: var(--emerald); }
    .input-panel textarea::placeholder { color: var(--muted); }

    .btn-row { display: flex; gap: 8px; }
    button {
      border: none; cursor: pointer;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: .88rem;
      font-weight: 600;
      transition: background .15s, transform .08s;
    }
    button:active { transform: scale(.97); }

    #goBtn {
      flex: 1;
      background: var(--emerald);
      color: #fff;
    }
    #goBtn:hover:not(:disabled) { background: var(--emerald-dark); }
    #goBtn:disabled { background: #a7f3d0; cursor: not-allowed; }

    #resetBtn {
      background: #fee2e2;
      color: var(--danger-dark);
    }
    #resetBtn:hover { background: #fecaca; }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">🤖</div>
    <div>
      <h1>Sidekick Personal Co-worker</h1>
      <div class="subtitle">LangGraph · Browser Agent · Evaluator</div>
    </div>
  </header>

  <!-- Chat area -->
  <div id="chat">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <p>Ask your sidekick anything — it will browse the web to answer.</p>
    </div>
  </div>

  <!-- Input panel -->
  <div class="input-panel">
    <textarea id="msgInput" rows="2"
              placeholder="Your request to your sidekick…"></textarea>
    <textarea id="criteriaInput" rows="1"
              placeholder="Success criteria (optional) — e.g. 'Provide the exact current price'"></textarea>
    <div class="btn-row">
      <button id="resetBtn" onclick="resetChat()">Reset</button>
      <button id="goBtn" onclick="sendMessage()">Go!</button>
    </div>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let threadId  = crypto.randomUUID();
  let history   = [];
  let busy      = false;

  // Allow Enter (without Shift) to submit in the message box
  document.getElementById("msgInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Render helpers ─────────────────────────────────────────────────────────
  function renderMarkdown(text) {
    return marked.parse(text || "", { breaks: true });
  }

  function appendMessage(role, content) {
    const chat = document.getElementById("chat");
    document.getElementById("emptyState")?.remove();

    const isEval = content.startsWith("Evaluator Feedback");
    const cls    = isEval ? "evaluator" : role;

    const avatarMap = { user: "You", assistant: "🤖", evaluator: "📋" };
    const labelMap  = { user: "You", assistant: "Sidekick", evaluator: "Evaluator" };

    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    div.innerHTML = `
      <div class="avatar">${avatarMap[cls] ?? "🤖"}</div>
      <div>
        <div class="label">${labelMap[cls] ?? "Sidekick"}</div>
        <div class="bubble">${renderMarkdown(content)}</div>
      </div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function showTyping() {
    const chat = document.getElementById("chat");
    document.getElementById("emptyState")?.remove();
    const div = document.createElement("div");
    div.id = "typing";
    div.className = "msg assistant typing";
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div>
        <div class="label">Sidekick</div>
        <div class="bubble">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  // ── API calls ──────────────────────────────────────────────────────────────
  async function sendMessage() {
    if (busy) return;
    const msg      = document.getElementById("msgInput").value.trim();
    const criteria = document.getElementById("criteriaInput").value.trim();
    if (!msg) return;

    busy = true;
    document.getElementById("goBtn").disabled = true;

    // Show user message immediately
    appendMessage("user", msg);
    document.getElementById("msgInput").value = "";
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: msg,
          success_criteria: criteria,
          history: history,
          thread_id: threadId,
        }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        appendMessage("assistant", `⚠️ Error: ${err.error ?? res.statusText}`);
      } else {
        const data = await res.json();
        threadId = data.thread_id;
        history  = data.messages;

        // The response always has: user msg, assistant reply, evaluator feedback
        // We already showed the user message, so render the last 2
        const newMsgs = data.messages.slice(-2);
        for (const m of newMsgs) {
          appendMessage(m.role, m.content);
        }
      }
    } catch (err) {
      removeTyping();
      appendMessage("assistant", `⚠️ Network error: ${err.message}`);
    }

    busy = false;
    document.getElementById("goBtn").disabled = false;
    document.getElementById("msgInput").focus();
  }

  async function resetChat() {
    try {
      const res = await fetch("/api/reset", { method: "POST" });
      const data = await res.json();
      threadId = data.thread_id;
    } catch {
      threadId = crypto.randomUUID();
    }
    history = [];
    const chat = document.getElementById("chat");
    chat.innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="icon">💬</div>
        <p>Ask your sidekick anything — it will browse the web to answer.</p>
      </div>`;
    document.getElementById("msgInput").value    = "";
    document.getElementById("criteriaInput").value = "";
    document.getElementById("msgInput").focus();
  }
</script>
</body>
</html>
