[project]
name = "debater_app"
version = "0.1.0"
description = "debater-app using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    # RAG pipeline dependencies
    "faiss-cpu>=1.7.4",
    "huggingface-hub>=0.23.0",
    "langchain-huggingface>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
]

[project.scripts]
debater_app = "debater_app.main:run"
run_crew = "debater_app.main:run"
train = "debater_app.main:train"
replay = "debater_app.main:replay"
test = "debater_app.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
