identify_intent:
  description: >
    Analyze the following user request and identify the patient's intent, the type of specialist
    required, key patient details (age, condition), and the actions that need to be taken:

    User Request: {user_request}

    Break down the request into clear sub-tasks for the other agents to execute.
  expected_output: >
    A structured summary containing:
    - Patient intent (e.g., book an appointment)
    - Specialist required (e.g., Nephrologist)
    - Patient details (e.g., 70-year-old father with CKD)
    - List of delegated sub-tasks for the medical records manager, healthcare scheduler, and research specialist
  agent: manager
  output_file: output/identify_intent.md

retrieve_medical_history:
  description: >
    Using the patient details identified in the previous task, retrieve the patient's medical
    records. Confirm the diagnosis of Chronic Kidney Disease (CKD) and flag any critical alerts
    such as allergies, current medications, or contraindications that the scheduling and research
    agents should be aware of.
  expected_output: >
    A concise medical history report including:
    - Confirmed diagnosis (CKD)
    - Patient age and relevant demographics
    - Current medications and dosages
    - Known allergies or critical alerts
    - Any other notes relevant to a Nephrologist consultation
  agent: medical_records_manager
  context:
    - identify_intent
  output_file: output/medical_history.md

book_appointment:
  description: >
    Based on the confirmed diagnosis and patient details from the medical history report, search
    for available Nephrologist slots. Select the earliest suitable appointment and generate a
    booking confirmation for the patient's family.
  expected_output: >
    An appointment confirmation containing:
    - Specialist name and designation (Nephrologist)
    - Appointment date and time
    - Clinic or hospital location
    - Any pre-appointment instructions for the patient
    - Confirmation reference number
  agent: healthcare_assistant
  context:
    - retrieve_medical_history
  output_file: output/appointment_confirmation.md

research_ckd_treatment:
  description: >
    Conduct a RAG-based search across trusted medical sources (WHO, Medline, internal clinical
    PDFs) on the topic: "latest treatment methods for CKD in elderly patients". Summarize the
    most current evidence-based guidelines and treatment options suitable for a 70-year-old
    patient with Chronic Kidney Disease.
  expected_output: >
    A research summary containing:
    - Overview of current CKD staging and management guidelines for elderly patients
    - Latest pharmacological treatments (e.g., SGLT2 inhibitors, ACE inhibitors)
    - Recommended lifestyle and dietary modifications
    - Any recent clinical trial findings relevant to elderly CKD patients
    - Cited sources (WHO, Medline, or equivalent)
  agent: medical_research_specialist
  context:
    - retrieve_medical_history
  output_file: output/ckd_research_summary.md