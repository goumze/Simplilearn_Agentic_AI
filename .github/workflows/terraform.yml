name: Terraform Infrastructure

on:
  pull_request:
    paths:
      - "vacation_planner/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [feature/rahul_trisal_projects]
    paths:
      - "vacation_planner/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: vacation_planner/terraform

jobs:
  plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform fmt -check -recursive

      - run: terraform init -input=false

      - run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const { execSync } = require('child_process');
            let out = execSync('terraform show -no-color tfplan', { cwd: 'vacation_planner/terraform' }).toString();
            if (out.length > 60000) out = out.slice(0, 60000) + '\n... (truncated)';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan (${process.env.PLAN_OUTCOME})\n\`\`\`\n${out}\n\`\`\``,
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: vacation_planner/terraform/tfplan

  apply:
    name: Apply
    needs: plan
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/rahul_trisal_projects') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'plan')
    runs-on: ubuntu-latest
    environment: infrastructure # add required reviewers on this environment for manual approval
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: vacation_planner/terraform

      - run: terraform init -input=false

      - name: Apply saved plan
        run: terraform apply -input=false tfplan
