name: Teardown Multi-Agent Platform from EKS

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS Region of EKS cluster
        required: false
        default: ap-south-1
        type: string
      cluster_name:
        description: Name of EKS cluster to tear down
        required: false
        default: finops-agents
        type: string
      environment:
        description: Environment being torn down
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm_deletion:
        description: Type 'yes-delete-all' to confirm teardown
        required: true
        type: string

env:
  AWS_REGION: ${{ github.event.inputs.aws_region || 'ap-south-1' }}
  CLUSTER_NAME: ${{ github.event.inputs.cluster_name || 'finops-agents' }}

jobs:
  validate:
    name: Validate Teardown Request
    runs-on: ubuntu-latest
    steps:
      - name: Verify deletion confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deletion }}" != "yes-delete-all" ]; then
            echo "❌ Deletion not confirmed. Please set confirm_deletion to 'yes-delete-all'"
            exit 1
          fi
          echo "✅ Deletion confirmed for cluster: ${{ env.CLUSTER_NAME }}"

      - name: Verify cluster exists
        run: |
          echo "⚠️  This will DELETE all resources in cluster: ${{ env.CLUSTER_NAME }}"
          echo "   Region: ${{ env.AWS_REGION }}"
          echo "   Environment: ${{ github.event.inputs.environment }}"
          echo ""
          echo "✅ Proceeding with teardown..."

  pause-argocd:
    name: Pause ArgoCD Auto-Sync
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          # role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          # aws-region: ${{ env.AWS_REGION }}
          # role-session-name: github-actions-teardown-pause

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }} 2>/dev/null || echo "⚠️  Cluster not reachable"

      - name: Pause ArgoCD auto-sync
        continue-on-error: true
        run: |
          echo "⏸️  Pausing ArgoCD auto-sync on all Applications..."
          
          # Check if cluster is reachable
          if ! kubectl get ns argocd >/dev/null 2>&1; then
            echo "⚠️  Cluster not reachable - skipping in-cluster cleanup"
            exit 0
          fi
          
          # Pause auto-sync on all applications
          APPS=$(kubectl -n argocd get application -o name 2>/dev/null || echo "")
          if [ -z "$APPS" ]; then
            echo "⚠️  No Applications found"
            exit 0
          fi
          
          for app in $APPS; do
            kubectl -n argocd patch "$app" --type=merge \
              -p '{"spec":{"syncPolicy":{"automated":null}}}' >/dev/null 2>&1 || true
            echo "  ✓ Paused $app"
          done
          
          echo "✅ Auto-sync paused on all Applications"

  delete-applications:
    name: Delete ArgoCD Applications
    runs-on: ubuntu-latest
    needs: pause-argocd
    environment:
      name: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 45
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          # role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          # aws-region: ${{ env.AWS_REGION }}
          # role-session-name: github-actions-teardown-apps

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }} 2>/dev/null || echo "⚠️  Cluster not reachable"

      - name: Delete Applications in reverse sync-wave order
        continue-on-error: true
        run: |
          # Helper function to delete an application with fallback
          delete_app() {
            local app="$1" timeout="$2" elapsed=0
            
            # Check if app exists
            if ! kubectl -n argocd get application/"$app" >/dev/null 2>&1; then
              echo "  ✓ $app not present"
              return 0
            fi
            
            echo "  ⏳ Deleting $app (timeout: ${timeout}s)..."
            kubectl -n argocd delete application/"$app" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
            
            # Poll for deletion
            while kubectl -n argocd get application/"$app" >/dev/null 2>&1; do
              if [ $elapsed -ge $timeout ]; then
                echo "  ⚠️  Cascade-prune on $app didn't finish in ${timeout}s — stripping finalizer"
                kubectl -n argocd patch application/"$app" --type=merge \
                  -p '{"metadata":{"finalizers":null}}' >/dev/null 2>&1 || true
                sleep 5
                kubectl -n argocd delete application/"$app" --ignore-not-found=true >/dev/null 2>&1 || true
                return 0
              fi
              sleep 10
              elapsed=$((elapsed + 10))
            done
            echo "  ✓ $app deleted"
          }
          
          # Check if cluster is reachable
          if ! kubectl get ns argocd >/dev/null 2>&1; then
            echo "⚠️  Cluster not reachable — skipping in-cluster cleanup"
            echo "⚠️  Any orphaned AgentCore / IAM / PodIdentityAssociation resources in AWS will need manual cleanup"
            exit 0
          fi
          
          echo "🗑️  Deleting Applications in reverse sync-wave order..."
          echo ""
          
          # Delete in reverse order (highest wave first)
          delete_app financial-services          600   # agents + claims -> ACK CRs -> AWS
          delete_app litellm                     180   # Deployment + Postgres PVC
          delete_app agent-gateway-config        120   # Gateway + JWT/RBAC policies
          delete_app agent-gateway               180   # Gateway controller + service
          delete_app agentcore-rgds              180   # kro ResourceGraphDefinitions
          delete_app auto-mode-defaults          120   # StorageClass + IngressClass
          delete_app agentgateway-crds           120
          delete_app gateway-api-crds            120
          delete_app platform-root               60    # root app-of-apps
          
          echo ""
          echo "✅ All Applications deleted"

  teardown-bootstrap:
    name: Terraform Destroy Bootstrap
    runs-on: ubuntu-latest
    needs: delete-applications
    environment:
      name: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          # role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          # aws-region: ${{ env.AWS_REGION }}
          # role-session-name: github-actions-teardown-bootstrap

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.1

      - name: Initialize Terraform (bootstrap)
        run: |
          cd terraform/bootstrap
          terraform init -upgrade

      - name: Destroy Terraform (bootstrap)
        run: |
          cd terraform/bootstrap
          echo "🗑️  Destroying bootstrap resources (ArgoCD + platform-root)..."
          terraform destroy -auto-approve \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "cluster_name=${{ env.CLUSTER_NAME }}" \
            ${GITOPS_REPO_URL:+-var "gitops_repo_url=${GITOPS_REPO_URL}"} || true
          echo "✅ Bootstrap resources destroyed"

      - name: Upload Terraform state
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: terraform-bootstrap-destroy-state
          path: terraform/bootstrap/terraform.tfstate*
          retention-days: 7

  teardown-cluster:
    name: Terraform Destroy Cluster
    runs-on: ubuntu-latest
    needs: teardown-bootstrap
    environment:
      name: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          # role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          # aws-region: ${{ env.AWS_REGION }}
          # role-session-name: github-actions-teardown-cluster

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.1

      - name: Initialize Terraform (cluster)
        run: |
          cd terraform/cluster
          terraform init -upgrade

      - name: Destroy Terraform (cluster)
        run: |
          cd terraform/cluster
          echo "🗑️  Destroying cluster resources (this takes ~15 minutes)..."
          terraform destroy -auto-approve \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "cluster_name=${{ env.CLUSTER_NAME }}" || true
          echo "✅ Cluster destroyed"

      - name: Upload Terraform state
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: terraform-cluster-destroy-state
          path: terraform/cluster/terraform.tfstate*
          retention-days: 7

  spot-check:
    name: Spot-Check for Orphan AWS Resources
    runs-on: ubuntu-latest
    needs: teardown-cluster
    if: always()
    environment:
      name: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-spotcheck

      - name: Check for orphan Bedrock AgentCore resources
        continue-on-error: true
        run: |
          echo "🔍 Checking for orphan AgentCore resources..."
          echo ""
          
          echo "**Memories:**"
          aws bedrock-agentcore-control list-memories \
            --region ${{ env.AWS_REGION }} \
            --query 'memories[].[name, status]' \
            --output table 2>/dev/null || echo "  ✓ None found"
          echo ""
          
          echo "**Browsers:**"
          aws bedrock-agentcore-control list-browsers \
            --region ${{ env.AWS_REGION }} \
            --query 'browsers[].[name, status]' \
            --output table 2>/dev/null || echo "  ✓ None found"
          echo ""
          
          echo "**Code Interpreters:**"
          aws bedrock-agentcore-control list-code-interpreters \
            --region ${{ env.AWS_REGION }} \
            --query 'codeInterpreters[].[name, status]' \
            --output table 2>/dev/null || echo "  ✓ None found"

      - name: Check for orphan IAM roles
        continue-on-error: true
        run: |
          echo "🔍 Checking for orphan IAM roles..."
          echo ""
          
          ORPHAN_ROLES=$(aws iam list-roles \
            --query "Roles[?starts_with(RoleName, 'fs-')].RoleName" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$ORPHAN_ROLES" ]; then
            echo "  ✓ No orphan roles found"
          else
            echo "  ⚠️  Orphan roles detected:"
            echo "$ORPHAN_ROLES" | tr '\t' '\n' | sed 's/^/    - /'
          fi

      - name: Check for orphan Pod Identity Associations
        continue-on-error: true
        run: |
          echo "🔍 Checking for orphan Pod Identity Associations..."
          echo ""
          
          # This command may fail if cluster doesn't exist
          PIA_COUNT=$(aws eks list-pod-identity-associations \
            --cluster-name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'associations | length(@)' \
            --output text 2>/dev/null || echo "0")
          
          if [ "$PIA_COUNT" = "0" ]; then
            echo "  ✓ No orphan Pod Identity Associations"
          else
            echo "  ⚠️  $PIA_COUNT Pod Identity Association(s) remain"
            aws eks list-pod-identity-associations \
              --cluster-name ${{ env.CLUSTER_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --query 'associations[].[podIdentityAssociationArn, status]' \
              --output table 2>/dev/null || true
          fi

  post-teardown:
    name: Teardown Summary
    runs-on: ubuntu-latest
    needs: [teardown-cluster, spot-check]
    if: always()
    environment:
      name: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Generate teardown report
        run: |
          cat > teardown-report.md << EOF
          # Multi-Agent Platform Teardown Report
          
          ## Teardown Details
          - **Cluster Name**: ${{ env.CLUSTER_NAME }}
          - **Region**: ${{ env.AWS_REGION }}
          - **Environment**: ${{ github.event.inputs.environment }}
          - **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ## What Was Deleted
          
          1. ✅ ArgoCD Applications (in reverse sync-wave order)
             - financial-services (agents + AgentCore claims)
             - litellm
             - agent-gateway-config
             - agent-gateway
             - agentcore-rgds
             - auto-mode-defaults
             - agentgateway-crds
             - gateway-api-crds
             - platform-root
          
          2. ✅ Bootstrap Resources
             - ArgoCD Helm release
             - Platform root Application
          
          3. ✅ Cluster Resources
             - EKS Auto Mode cluster
             - VPC + Subnets
             - Security Groups
             - NAT Gateway
             - IAM Roles + Policies
             - Pod Identity Associations
             - EKS Capabilities (ACK, kro)
          
          ## Manual Cleanup (if needed)
          
          If any cascade-prune operations timed out, there may be orphan resources:
          
          \`\`\`bash
          # Check for orphan AgentCore resources
          aws bedrock-agentcore-control list-memories --region ${{ env.AWS_REGION }}
          aws bedrock-agentcore-control list-browsers --region ${{ env.AWS_REGION }}
          aws bedrock-agentcore-control list-code-interpreters --region ${{ env.AWS_REGION }}
          
          # Check for orphan IAM roles
          aws iam list-roles --query 'Roles[?starts_with(RoleName, \`fs-\`)].RoleName'
          
          # Check for orphan Pod Identity Associations
          aws eks list-pod-identity-associations --cluster-name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          \`\`\`
          
          ## Spot-Check Results
          
          See workflow logs above for detailed spot-check results.
          
          EOF
          
          cat teardown-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload teardown report
        uses: actions/upload-artifact@v3
        with:
          name: teardown-report
          path: teardown-report.md
          retention-days: 30

      - name: Print summary
        run: |
          echo "## ✅ Teardown Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cluster **${{ env.CLUSTER_NAME }}** in **${{ env.AWS_REGION }}** has been deleted." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the spot-check results above to verify all resources were cleaned up." >> $GITHUB_STEP_SUMMARY
