name: Deploy

on:
  pull_request:
    paths:
      - "vacation_planner/terraform/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [feature/rahul_trisal_projects]
    paths:
      - "vacation_planner/terraform/**"
      - "vacation_planner/src/**"
      - "vacation_planner/Dockerfile"
      - "vacation_planner/requirements.txt"
      - "vacation_planner/requirements-agent.txt"
      - "vacation_planner/pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run (destroy deletes the ECR repository and ALL its images)"
        type: choice
        options: [plan, apply, destroy]
        default: apply
      confirm:
        description: 'Only for destroy: type "destroy" to confirm'
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vacation_planner
  TF_IN_AUTOMATION: "true"

jobs:
