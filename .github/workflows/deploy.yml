name: Deploy

on:
  pull_request:
    paths:
      - "vacation_planner/terraform/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [feature/rahul_trisal_projects]
    paths:
      - "vacation_planner/terraform/**"
      - "vacation_planner/src/**"
      - "vacation_planner/Dockerfile"
      - "vacation_planner/requirements.txt"
      - "vacation_planner/pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run (destroy deletes the ECR repository and ALL its images)"
        type: choice
        options: [plan, apply, destroy]
        default: apply

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vacation_planner
  TF_IN_AUTOMATION: "true"
  DESTROY_WAIT_SECONDS: "120"

jobs:
  # 0. Ask whether to destroy. Manual runs answer through the "action" input.
  #    On push, wait up to 2 minutes for a commit comment "destroy" from a
  #    collaborator; with no answer, the deployment goes ahead.
  decide:
    name: Destroy or deploy?
    runs-on: ubuntu-latest
    outputs:
      destroy: ${{ steps.ask.outputs.destroy }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.inputs.action }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          destroy=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$ACTION" = "destroy" ] && destroy=true
          elif [ "$EVENT" = "push" ]; then
            echo "Destroy the ECR repository and all images?"
            echo "Reply by commenting 'destroy' on this commit within ${DESTROY_WAIT_SECONDS}s:"
            echo "https://github.com/$REPO/commit/$SHA"
            echo "No answer = continue with the deployment."
            deadline=$((SECONDS + DESTROY_WAIT_SECONDS))
            while [ $SECONDS -lt $deadline ]; do
              match=$(gh api "repos/$REPO/commits/$SHA/comments" --paginate \
                --jq '.[] | select((.body | gsub("\\s";"") | ascii_downcase) == "destroy" and (.author_association | IN("OWNER","MEMBER","COLLABORATOR"))) | .id')
              if [ -n "$match" ]; then
                destroy=true
                break
              fi
              sleep 10
            done
          fi
          echo "destroy=$destroy" >> "$GITHUB_OUTPUT"
          echo "Decision: destroy=$destroy"

  # 1. Validate and plan the infrastructure (ECR repository).
  plan:
    name: Terraform plan
    needs: decide
    if: needs.decide.outputs.destroy != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vacation_planner/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform fmt -check -recursive

      - run: terraform init -input=false

      - run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const { execSync } = require('child_process');
            let out = execSync('terraform show -no-color tfplan', { cwd: 'vacation_planner/terraform' }).toString();
            if (out.length > 60000) out = out.slice(0, 60000) + '\n... (truncated)';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan (${process.env.PLAN_OUTCOME})\n\`\`\`\n${out}\n\`\`\``,
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: vacation_planner/terraform/tfplan

  # 2. Apply the plan. Creates the ECR repository only if it does not exist (state is in S3).
  apply:
    name: Terraform apply
    needs: [decide, plan]
    if: >-
      needs.decide.outputs.destroy != 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vacation_planner/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: vacation_planner/terraform

      - run: terraform init -input=false

      - name: Apply saved plan
        run: terraform apply -input=false tfplan

  # 3. Build the image and push it to ECR once the repository is guaranteed to exist.
  build-push:
    name: Build & push image
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || {
            echo "::error::ECR repository '$ECR_REPOSITORY' not found."
            exit 1
          }

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # AgentCore Runtime requires linux/arm64 images.
      - uses: docker/build-push-action@v6
        with:
          context: vacation_planner
          file: vacation_planner/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Destroys the ECR repository and all its images when requested.
  destroy:
    name: Destroy ECR repository
    needs: decide
    if: needs.decide.outputs.destroy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vacation_planner/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false

      # Make sure force_delete=true is in state so images do not block deletion.
      - name: Enable force_delete on the repository
        run: terraform apply -input=false -auto-approve -target=module.ecr.aws_ecr_repository.vacation_planner

      - name: Destroy
        run: terraform destroy -input=false -auto-approve
